<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7f4b">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eco Lagos">
<link rel="apple-touch-icon" href="icons/logo.jpg">
<link rel="icon" type="image/png" href="icons/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Pacifico&display=swap">
<title>Task Planner</title>
<style>
:root{--bg:#f6f8f6;--card:#fff;--tx:#17211b;--mut:#66726b;--bd:#dde4df;--g:#1b7f4b;--r:#d6382f;--gs:#e3f4ea;--rs:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#19201c;--tx:#e8efe9;--mut:#93a09a;--bd:#2a342e;--g:#3fbf7f;--r:#ff6b5f;--gs:#173226;--rs:#3a1c19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101512;--card:#19201c;--tx:#e8efe9;--mut:#93a09a;--bd:#2a342e;--g:#3fbf7f;--r:#ff6b5f;--gs:#173226;--rs:#3a1c19;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.page{display:none}.page.on{display:block}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:600}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--r);border-radius:12px;padding:12px;margin-bottom:10px}
.card.done{border-left-color:var(--g);opacity:.65}.card.done .nm{text-decoration:line-through}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600}.meta{font-size:13px;color:var(--mut);margin-top:2px}.note{font-size:14px;margin-top:6px}
.badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--rs);color:var(--r)}
.badge.ok{background:var(--gs);color:var(--g)}
.bar{height:5px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.act{display:flex;gap:6px}
.ic{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 9px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .h{font-size:12px;color:var(--mut)}
.d{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:var(--card);color:var(--tx);position:relative;padding:0}
.d.x{visibility:hidden}
.d.today{background:var(--g);color:#fff;font-weight:700}
.d.sel{border-color:var(--tx)}
.d i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.d i.r{background:var(--r)}.d i.g{background:var(--g)}.d.today i{box-shadow:0 0 0 2px #fff}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0;font-size:12px}
.tabs button b{display:block;font-size:20px}.tabs button.on{color:var(--g);font-weight:700}
.empty{color:var(--mut);text-align:center;padding:18px}
.banner{background:var(--gs);color:var(--g);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.err{color:var(--r);font-size:13px;margin-top:8px;min-height:18px}
.brand{text-align:center;padding:6px 0 14px;margin-bottom:6px;border-bottom:1px dashed var(--bd)}
.brand img{width:84px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.brand h2{margin:4px 0 0;font:800 30px/1.1 Montserrat,system-ui,sans-serif;letter-spacing:.14em;background:linear-gradient(90deg,#0f6b3a,#7ccf1a,#0f6b3a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.brand p{margin:6px 0 0;font:19px Pacifico,cursive,Georgia,serif;color:var(--g)}
#auth{display:none}body.out #auth{display:block}body.boot #auth{display:none!important}
body.out .page,body.out .tabs,body.out #banner,body.out #acct{display:none!important}
.tabs2{display:flex;gap:6px;margin-bottom:6px}.tabs2 button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:10px}.tabs2 button.on{background:var(--g);color:#fff;border-color:var(--g)}
#acct{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px}
</style>
</head>
<body class="out boot">
<main>
<div class="brand" id="brand"><img alt="Eco Lagos logo" src="icons/logo.jpg"><h2>ECO LAGOS</h2><p>Let’s keep the city greener today 🌿</p></div>
<section id="auth">
 <div class="tabs2"><button id="tIn" class="on">Log in</button><button id="tUp">Sign up</button></div>
 <label for="em">Email</label><input id="em" type="email" autocomplete="email">
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
 <div id="codeW" style="display:none"><label for="code">Access code</label><input id="code" placeholder="Ask the owner for the code" autocomplete="off"></div>
 <div class="err" id="aerr"></div>
 <button class="btn" id="go">Log in</button>
</section>
<div id="acct"><span id="who"></span><button class="ic" id="logout">Log out</button></div>
<div id="banner"></div>

<section class="page on" id="p-add">
  <h1>New task</h1>
  <label for="name">Task name</label>
  <input id="name" placeholder="e.g. Collect plastics from Ikeja market">
  <div class="row">
    <div><label for="start">Start date</label><input type="date" id="start"></div>
    <div><label for="end">Due / end date</label><input type="date" id="end"></div>
  </div>
  <label for="time">Time</label>
  <input type="time" id="time">
  <label for="note">Note</label>
  <textarea id="note" rows="3" placeholder="Details, contact, location…"></textarea>
  <div class="err" id="err"></div>
  <button class="btn" id="save">Save task</button>
  <p class="meta">Tip: for a one-day appointment, leave the end date empty. For a goal across several days, set the start and the due date and it will show up on every day in between.</p>
  <button class="btn sm" id="inst" style="margin-top:10px;margin-right:6px">📲 Add to home screen</button>
  <button class="btn sm" id="notif" style="margin-top:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd)">🔔 Enable reminders</button>
</section>

<section class="page" id="p-cal">
  <h1>Calendar</h1>
  <div class="nav"><button class="ic" id="cp">‹</button><b id="cm"></b><button class="ic" id="cn">›</button></div>
  <div class="grid" id="grid"></div>
  <h2 id="dayT"></h2>
  <div id="dayL"></div>
</section>

<section class="page" id="p-mon">
  <h1>Month tasks</h1>
  <div class="nav"><button class="ic" id="mp">‹</button><b id="mm"></b><button class="ic" id="mn">›</button></div>
  <div id="monL"></div>
</section>
</main>

<nav class="tabs">
  <button data-p="add" class="on"><b>＋</b>Add</button>
  <button data-p="cal"><b>📅</b>Calendar</button>
  <button data-p="mon"><b>🗒️</b>Month</button>
</nav>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,getDoc,updateDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
let uid=null,unsub=null,signingUp=false;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>ymd(new Date());
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
let tasks=[];
const tcol=()=>collection(db,'users',uid,'tasks');
let cal=new Date(),mon=new Date(),sel=today();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const onDay=(t,d)=>t.start<=d&&d<=t.end;
const fmt=s=>parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});

function countdown(t){
  const n=today();
  if(t.done)return['Completed ✓',1];
  if(n>t.end){const k=diff(t.end,n);return['Overdue by '+k+(k>1?' days':' day'),0]}
  if(n<t.start){return['Starts in '+diff(n,t.start)+' d · due in '+diff(n,t.end)+' d',0]}
  const k=diff(n,t.end);
  return[k===0?'Due today':k+(k>1?' days':' day')+' left',k>1?1:0];
}
function card(t){
  const total=diff(t.start,t.end)+1,n=today();
  const dayNo=Math.min(Math.max(diff(t.start,n)+1,0),total);
  const [c,ok]=countdown(t);
  const range=t.start===t.end?fmt(t.start):fmt(t.start)+' → '+fmt(t.end);
  return `<div class="card ${t.done?'done':''}"><div class="top"><div><div class="nm">${esc(t.name)}</div>
  <div class="meta">${range}${t.time?' · '+t.time:''}${total>1?' · day '+dayNo+' of '+total:''}</div></div>
  <div class="act"><button class="ic" data-done="${t.id}">${t.done?'↩':'✓'}</button><button class="ic" data-del="${t.id}">🗑</button></div></div>
  ${t.note?'<div class="note">'+esc(t.note)+'</div>':''}
  <span class="badge ${ok?'ok':''}">${c}</span>
  ${total>1?'<div class="bar"><i style="width:'+Math.round(dayNo/total*100)+'%"></i></div>':''}</div>`;
}
const sortT=a=>a.slice().sort((x,y)=>(x.time||'99').localeCompare(y.time||'99')||x.start.localeCompare(y.start));

function renderCal(){
  const y=cal.getFullYear(),m=cal.getMonth();
  $('cm').textContent=MN[m]+' '+y;
  let h=['S','M','T','W','T','F','S'].map(d=>'<div class="h">'+d+'</div>').join('');
  const first=new Date(y,m,1).getDay(),len=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)h+='<button class="d x"></button>';
  for(let d=1;d<=len;d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d),ts=tasks.filter(t=>onDay(t,s));
    const dot=ts.length?(ts.every(t=>t.done)?'g':'r'):'';
    h+=`<button class="d ${s===today()?'today':''} ${s===sel?'sel':''}" data-d="${s}">${d}${dot?'<i class="'+dot+'"></i>':''}</button>`;
  }
  $('grid').innerHTML=h;
  const L=sortT(tasks.filter(t=>onDay(t,sel)));
  $('dayT').textContent=(sel===today()?'Today · ':'')+fmt(sel);
  $('dayL').innerHTML=L.length?L.map(card).join(''):'<div class="empty">No tasks on this day.</div>';
}
function renderMon(){
  const y=mon.getFullYear(),m=mon.getMonth();
  $('mm').textContent=MN[m]+' '+y;
  const a=y+'-'+pad(m+1)+'-01',b=y+'-'+pad(m+1)+'-'+pad(new Date(y,m+1,0).getDate());
  const L=sortT(tasks.filter(t=>t.start<=b&&t.end>=a)).sort((x,y)=>x.start.localeCompare(y.start));
  $('monL').innerHTML=L.length?L.map(card).join(''):'<div class="empty">No tasks this month.</div>';
}
function renderBanner(){
  const n=today(),k=tasks.filter(t=>!t.done&&onDay(t,n)).length;
  $('banner').innerHTML=k?`<div class="banner">🔔 You have ${k} task${k>1?'s':''} for today</div>`:'';
}
function renderAll(){renderBanner();renderCal();renderMon()}

function show(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('brand').style.display=(p==='cal')?'none':'block';renderAll();window.scrollTo(0,0);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.p));

$('start').value=today();
$('save').onclick=()=>{
  const name=$('name').value.trim(),start=$('start').value,end=$('end').value||start;
  if(!name){$('err').textContent='Please enter a task name.';return}
  if(!start){$('err').textContent='Please pick a start date.';return}
  if(end<start){$('err').textContent='The end date can’t be before the start date.';return}
  setDoc(doc(db,'users',uid,'tasks',String(Date.now())),{name,start,end,time:$('time').value,note:$('note').value.trim(),done:false}).catch(()=>alert('Could not save. Check your connection.'));
  $('err').textContent='';
  ['name','end','time','note'].forEach(i=>$(i).value='');
  $('start').value=today();
  sel=start;cal=parse(start);mon=parse(start);
  show('cal');
};
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-d]');
  if(d){sel=d.dataset.d;renderCal();return}
  const dn=e.target.closest('[data-done]');
  if(dn){const t=tasks.find(x=>x.id==dn.dataset.done);updateDoc(doc(db,'users',uid,'tasks',t.id),{done:!t.done});return}
  const dl=e.target.closest('[data-del]');
  if(dl&&confirm('Delete this task?')){deleteDoc(doc(db,'users',uid,'tasks',dl.dataset.del))}
});
$('cp').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);renderCal()};
$('cn').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);renderCal()};
$('mp').onclick=()=>{mon=new Date(mon.getFullYear(),mon.getMonth()-1,1);renderMon()};
$('mn').onclick=()=>{mon=new Date(mon.getFullYear(),mon.getMonth()+1,1);renderMon()};

function remind(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const n=today();
    if(localStorage.getItem('notified')===n)return;
    const L=tasks.filter(t=>!t.done&&onDay(t,n));
    if(L.length){new Notification('Tasks for today',{body:L.map(t=>t.name+' ('+countdown(t)[0]+')').join('\n')});localStorage.setItem('notified',n)}
  }catch(e){}
}
$('notif').onclick=async()=>{
  try{const r=await Notification.requestPermission();$('notif').textContent=r==='granted'?'🔔 Reminders on':'Reminders blocked';remind()}
  catch(e){$('notif').textContent='Not supported here'}
};
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
$('inst').onclick=async()=>{
  if(dp){dp.prompt();dp=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  alert(ios?'On iPhone: tap the Share button in Safari, then “Add to Home Screen”.':'On Android: tap the ⋮ menu in Chrome, then “Add to Home screen” (or “Install app”).');
};
let mode='in';
const setMode=m=>{mode=m;$('tIn').classList.toggle('on',m==='in');$('tUp').classList.toggle('on',m==='up');$('codeW').style.display=m==='up'?'block':'none';$('go').textContent=m==='up'?'Create account':'Log in';$('aerr').textContent=''};
$('tIn').onclick=()=>setMode('in');$('tUp').onclick=()=>setMode('up');
const msg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'That email already has an account. Log in instead.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Please enter a valid email.','auth/too-many-requests':'Too many attempts. Try again later.'}[e.code]||'Something went wrong. Please try again.');
async function enter(u){
  try{const m=await getDoc(doc(db,'members',u.uid));
    if(!m.exists()){await signOut(auth);$('aerr').textContent='This account has no access.';return}}catch(e){}
  uid=u.uid;unsub&&unsub();
  unsub=onSnapshot(tcol(),s=>{tasks=s.docs.map(d=>({...d.data(),id:d.id}));renderAll();remind()},()=>{});
  $('who').textContent=u.email;document.body.classList.remove('out');show('add');
}
function leave(){unsub&&unsub();unsub=null;uid=null;tasks=[];document.body.classList.add('out');$('brand').style.display='block'}
$('go').onclick=async()=>{
  const em=$('em').value.trim(),pw=$('pw').value,code=$('code').value.trim();$('aerr').textContent='';
  if(!em||!pw){$('aerr').textContent='Enter your email and password.';return}
  if(mode==='up'&&!code){$('aerr').textContent='Enter the access code.';return}
  $('go').disabled=true;
  try{
    if(mode==='in'){await signInWithEmailAndPassword(auth,em,pw)}
    else{
      signingUp=true;
      const c=await createUserWithEmailAndPassword(auth,em,pw);
      try{await setDoc(doc(db,'members',c.user.uid),{email:em,code})}
      catch(e){await c.user.delete();signingUp=false;leave();throw {code:'bad-code'}}
      signingUp=false;await enter(c.user);
    }
  }catch(e){$('aerr').textContent=e.code==='bad-code'?'Invalid access code.':msg(e)}
  finally{signingUp=false;$('go').disabled=false}
};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{document.body.classList.remove('boot');if(signingUp)return;u?enter(u):leave()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{renderAll();remind()},60000);
</script>
</body>
</html>
