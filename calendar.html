<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7f4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eco Lagos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Pacifico&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/calendar.css">
<title>Calendar · Eco Lagos</title>
</head>
<body class="boot" data-page="calendar">
<main>
  <div id="banner"></div>
  <h1>Calendar</h1>
  <div class="month-nav"><button class="icon-btn" id="prev">‹</button><b id="title"></b><button class="icon-btn" id="next">›</button></div>
  <div class="grid" id="grid"></div>
  <p class="legend"><span class="dot r"></span> has tasks &nbsp; <span class="dot g"></span> all done &nbsp; <span class="today-key">today</span></p>
  <h2 id="dayTitle"></h2>
  <div id="dayList"></div>
</main>
<nav class="tabs" id="nav"></nav>
<script type="module" src="js/calendar.js"></script>
</body>
</html>
