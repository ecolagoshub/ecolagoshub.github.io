<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7f4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eco Lagos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Pacifico&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/add.css">
<title>Add task · Eco Lagos</title>
</head>
<body class="boot" data-page="add">
<main>
  <div id="brand"></div>
  <div id="banner"></div>
  <h1>New task</h1>
  <label for="name">Task name</label>
  <input id="name" placeholder="e.g. Collect plastics from Ikeja market">
  <div class="row">
    <div><label for="start">Start date</label><input type="date" id="start"></div>
    <div><label for="end">Due / end date</label><input type="date" id="end"></div>
  </div>
  <label for="time">Time</label>
  <input type="time" id="time">
  <label for="note">Note</label>
  <textarea id="note" rows="3" placeholder="Details, contact, location…"></textarea>
  <div class="err" id="err"></div>
  <button class="btn" id="save">Save task</button>
  <p class="tip">For a one-day appointment, leave the due date empty. For a goal across several days (e.g. Monday to Saturday), set both dates and the task shows on every day in between.</p>
  <div class="btn-row">
    <button class="btn-light" id="inst">📲 Add to home screen</button>
    <button class="btn-light" id="notif">🔔 Enable reminders</button>
  </div>
</main>
<nav class="tabs" id="nav"></nav>
<script type="module" src="js/add.js"></script>
</body>
</html>
