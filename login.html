<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7f4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eco Lagos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Pacifico&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
<title>Log in · Eco Lagos</title>
</head>
<body class="boot" data-page="login">
<main>
  <div id="brand"></div>
  <div class="tabs2"><button id="tIn" class="on">Log in</button><button id="tUp">Sign up</button></div>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div id="codeW" hidden>
    <label for="code">Access code</label>
    <input id="code" placeholder="Ask the owner for the code" autocomplete="off">
  </div>
  <div class="err" id="aerr"></div>
  <button class="btn" id="go">Log in</button>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
